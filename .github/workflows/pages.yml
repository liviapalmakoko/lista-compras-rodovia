name: Verificar lista de compras
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Testar funções da lista
        run: node --test tests/*.test.js
      - name: Verificar JavaScript
        run: node --check docs/app.js
